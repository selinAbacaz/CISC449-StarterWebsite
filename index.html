<!DOCTYPE html>
<head>

       
        <title>Animated Gradient Background</title>

        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Jost:ital,wght@0,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        
    </head>

<html lang="en">

    
    <body class="custom-cursor">


        <div class=" bg-container" ">
            
            <section class="catSection">
                <img id="0" class="images" src="images/cat-explode.gif" alt="cat1" class="cat" hidden>
                <img id="1" class="images" src="images/cat-jammin.gif" alt="cat2" class="cat" hidden>
                <img id="2" class="images" src="images/cat-pop.gif" alt="cat1" class="cat" hidden>
                <img id="3" class="images" src="images/cat-vanish.gif" alt="cat1" class="cat" hidden>
            </section>
            

            <section class="content" >
                <h1> 🫵Hello Fellow ClassMates🫵 </h1>

                <section class="contentSection">
                    <div id="AddCats" class="custom-pointer contentDiv" 
                        > 
                        Add more cats (?)
                    </div>
                    <div id="RemoveCats" class="custom-pointer contentDiv" 
                        > 
                        Add less cats 
                    </div>

                </section>
                
            </section>


            <section class="otherSection">
                
                <img id="4"  src="images/corgi-evil.gif" alt="cat1" class="cat" hidden>
                

            </section>
            
        </div>

        <script>
            let currentCatIndex = 0;

            const addCats= document.getElementById("AddCats");
            const removeCats= document.getElementById("RemoveCats");

            addCats.addEventListener("click", () => {
                if (currentCatIndex < 5) {

                    console.log(currentCatIndex);
                    const cat = document.getElementById(currentCatIndex)
                    cat.hidden = false
                    currentCatIndex++;

                    
                }

            });

            removeCats.addEventListener("click", () => {
                if (currentCatIndex > 0) {

                    currentCatIndex--;
                    const cat = document.getElementById(currentCatIndex)
                    cat.hidden = true
                    
                    console.log(currentCatIndex);
                }
            });


        </script>


    </body>



</html>
